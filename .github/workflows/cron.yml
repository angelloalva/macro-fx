name: Actualizar Tablero Macro FX

on:
  push:
    paths:
      - 'input_profe.json'
  workflow_dispatch:
  schedule:
    # Ventanas clave post-noticias principales (UTC) — update_board.py solo llama a Gemini si hay noticia vencida +10m
    - cron: '40 0 * * 1-5'   # 19:40 Lima (Sesión Asia / AUD / NZD / JPY)
    - cron: '40 9 * * 1-5'   # 04:40 Lima (Sesión Londres / EUR / GBP)
    - cron: '40 13 * * 1-5'  # 08:40 Lima (Apertura NY / USD / CAD)
    - cron: '10 15 * * 1-5'  # 10:10 Lima (Datos 10:00 EST / ISM / Confianza)
    - cron: '10 19 * * 1-5'  # 14:10 Lima (FOMC / Tasas)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar analizador y volátiles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_board.py

      - name: Guardar cambios en state.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json input_profe.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática Macro FX [skip ci]"
          git push
