name: Actualizar Tablero Macro FX

on:
  push:
    paths:
      - 'input_profe.json'
  workflow_dispatch:
  schedule:
    # Programado automáticamente (+10 min después de cada noticia pendiente)
    - cron: '40 0 25 11 *' # [AUD] CPI AUD Y/Y (19:30 Lima / 00:30 UTC + 10m)
    - cron: '40 13 25 11 *' # [USD] GDP + Core PCE + Claims (08:30 Lima / 13:30 UTC + 10m)
    - cron: '40 23 26 11 *' # [JPY] CPI Tokyo JPY (18:30 Lima / 23:30 UTC + 10m)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar analizador y volátiles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_board.py

      - name: Guardar cambios en state.json y cron.yml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json input_profe.json .github/workflows/cron.yml
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática Macro FX [skip ci]"
          git push
